<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--ink:#efe9e4;--mute:#a79c98;--shu:#a3121b;--shu2:#e0313b;--line:rgba(239,233,228,.14);--panel:rgba(14,11,13,.82);--fd:"Shippori Mincho","Hiragino Mincho ProN",serif;--fb:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#07060a;color:var(--ink);font-family:var(--fb)}
body{touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;pointer-events:none;text-shadow:0 1px 10px #000}
header small{font-size:11px;letter-spacing:.2em;color:var(--mute)}
header h1{margin:2px 0 0;font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.06em}
#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);max-width:440px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#card .k{font-size:11px;letter-spacing:.2em;color:var(--mute)}
#card h2{margin:2px 0 6px;font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:.06em}
#card h2 span{font-size:13px;color:var(--shu2);margin-left:8px;letter-spacing:.1em}
#card p{margin:0 0 8px;font-size:13px;line-height:1.75}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12px;border-top:1px solid var(--line);padding-top:8px}
#card dt{color:var(--mute)}#card dd{margin:0}
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:8px}
nav button{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 13px var(--fb);cursor:pointer}
nav button.on{background:rgba(163,18,27,.8);border-color:transparent}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:16px;font-size:11px;color:var(--mute);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><small>霧ノ森 蝋人形館 · 鬼ごっこ</small><h1>鬼役の悪魔 六体</h1></header>
<div id="hint">ドラッグで回す · 悪魔をタップで選ぶ</div>
<section id="card"><div class="k" id="kk"></div><h2 id="nm"></h2><p id="tx"></p><dl id="dl"></dl></section>
<nav><button id="prev">◀</button><button id="all">全員</button><button id="walk">歩かせる</button><button id="next">▶</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const PI=Math.PI, V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75)); renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2('#120e14',.045); renderer.setClearColor('#0a080c');
const camera=new THREE.PerspectiveCamera(innerWidth<innerHeight?62:42,innerWidth/innerHeight,.05,200);
scene.add(new THREE.HemisphereLight('#5a6080','#140c0c',.55));
const key=new THREE.SpotLight('#ffd0a0',2.2,40,.6,.6,1.2); key.position.set(4,9,8); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key); scene.add(key.target);
const rim=new THREE.DirectionalLight('#7088ff',.7); rim.position.set(-6,5,-8); scene.add(rim);
const fill=new THREE.PointLight('#ff4020',.8,14,2); fill.position.set(0,.6,3); scene.add(fill);

let seed=7; const rnd=()=>((seed=seed*16807%2147483647)-1)/2147483646, R=(a,b)=>a+(b-a)*rnd();
function cnv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(c){ const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }
// 平面陰影のポリゴン材質
const P=(col,o)=>new THREE.MeshStandardMaterial(Object.assign({color:col,flatShading:true,roughness:.75},o||{}));
const glow=(col,i)=>new THREE.MeshStandardMaterial({color:'#000',emissive:col,emissiveIntensity:i||2.2,flatShading:true});
function lathe(pts,seg){ return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||10); }
function mesh(g,m,x,y,z,rx,ry,rz,sx,sy,sz){ const o=new THREE.Mesh(g,m); o.position.set(x||0,y||0,z||0); o.rotation.set(rx||0,ry||0,rz||0); if(sx) o.scale.set(sx,sy==null?sx:sy,sz==null?sx:sz); o.castShadow=true; return o; }
function jitter(g,a){ const p=g.attributes.position; for(let i=0;i<p.count;i++){ p.setXYZ(i,p.getX(i)+R(-a,a),p.getY(i)+R(-a,a)*.6,p.getZ(i)+R(-a,a)); } g.computeVertexNormals(); return g; }
function limb(len,r0,r1,m,seg){ const g=new THREE.CylinderGeometry(r1,r0,len,seg||6); g.translate(0,-len/2,0); return new THREE.Mesh(g,m); }
const glowTex=(()=>{ const c=cnv(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.3,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return tex(c); })();
function sprite(col,s,op){ const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:op==null?1:op})); m.scale.set(s,s,1); return m; }
function flameSprite(){ const c=cnv(64,128),g=c.getContext('2d'),gr=g.createRadialGradient(32,90,2,32,78,60); gr.addColorStop(0,'rgba(255,250,220,1)'); gr.addColorStop(.3,'rgba(255,180,70,.9)'); gr.addColorStop(.7,'rgba(220,70,20,.4)'); gr.addColorStop(1,'rgba(100,10,0,0)'); g.fillStyle=gr; g.beginPath(); g.moveTo(32,4); g.bezierCurveTo(62,64,56,124,32,124); g.bezierCurveTo(8,124,2,64,32,4); g.fill();
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(c),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false})); return s; }
// 二足の脚（歩行アニメ用の関節つき）
function legs(m,len,r,foot,footM,dx){ const L=[]; for(const s of [-1,1]){ const hip=new THREE.Group(); hip.position.set(s*(dx||.14),len*2,0); const th=limb(len,r,r*.8,m); hip.add(th); const knee=new THREE.Group(); knee.position.y=-len; hip.add(knee); knee.add(limb(len,r*.8,r*.6,m)); const f=mesh(new THREE.BoxGeometry(foot[0],foot[1],foot[2]),footM||m,0,-len,foot[2]*.3); knee.add(f); L.push({hip,knee}); } return L; }
function walkLegs(L,t,amp){ L.forEach((l,i)=>{ const p=t+(i?PI:0); l.hip.rotation.x=Math.sin(p)*amp; l.knee.rotation.x=Math.max(0,-Math.sin(p))*amp*1.3; }); }

/* ============================================================
   六体の悪魔（オリジナル）
   ============================================================ */
const DEMONS=[];
/* ---------- 布・面の手描きテクスチャ ---------- */
function ctex(w,h,f){ const c=cnv(w,h),x=c.getContext('2d'); f(x,w,h); const t=tex(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
function noise(x,w,h,n,a){ for(let i=0;i<n;i++){ const v=rnd()<.5?0:255; x.fillStyle=`rgba(${v},${v},${v},${(a*rnd()).toFixed(3)})`; x.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2); } }
const T={
 knit:ctex(128,128,(x,w,h)=>{ x.fillStyle='#5a5652'; x.fillRect(0,0,w,h); for(let r=0;r<16;r++) for(let c=0;c<16;c++){ x.strokeStyle=`rgba(0,0,0,${.25+rnd()*.15})`; x.lineWidth=1.5; x.beginPath(); x.moveTo(c*8,r*8); x.lineTo(c*8+4,r*8+7); x.lineTo(c*8+8,r*8); x.stroke(); } noise(x,w,h,600,.15); }),
 herring:ctex(128,128,(x,w,h)=>{ x.fillStyle='#4a4a4c'; x.fillRect(0,0,w,h); for(let c=0;c<16;c++) for(let r=0;r<32;r++){ x.strokeStyle=`rgba(${c%2?0:255},${c%2?0:255},${c%2?0:255},.12)`; x.beginPath(); x.moveTo(c*8,r*4); x.lineTo(c*8+8,r*4+(c%2?4:-4)); x.stroke(); } noise(x,w,h,500,.12); }),
 robe:ctex(256,256,(x,w,h)=>{ x.fillStyle='#1e1e22'; x.fillRect(0,0,w,h); x.strokeStyle='#b8bcc4'; x.lineWidth=3; for(let k=0;k<6;k++){ const y=k*48; x.beginPath(); x.moveTo(128,y); x.lineTo(60,y+40); x.moveTo(128,y); x.lineTo(196,y+40); x.moveTo(128,y+10); x.lineTo(128,y+46); x.moveTo(80,y+20); x.lineTo(40,y+20); x.moveTo(176,y+20); x.lineTo(216,y+20); x.stroke(); } x.lineWidth=2; for(const s of [20,236]){ x.beginPath(); x.moveTo(s,0); x.lineTo(s,h); x.stroke(); } noise(x,w,h,900,.1); }),
 leather:ctex(128,128,(x,w,h)=>{ x.fillStyle='#6a4428'; x.fillRect(0,0,w,h); for(let i=0;i<30;i++){ x.fillStyle=`rgba(0,0,0,${rnd()*.15})`; x.beginPath(); x.ellipse(rnd()*w,rnd()*h,rnd()*20,rnd()*10,rnd()*3,0,PI*2); x.fill(); } noise(x,w,h,800,.15); }),
 wood:ctex(128,256,(x,w,h)=>{ x.fillStyle='#9a7448'; x.fillRect(0,0,w,h); for(let i=0;i<40;i++){ x.strokeStyle=`rgba(60,30,10,${.2+rnd()*.3})`; x.lineWidth=1+rnd()*2; const xx=rnd()*w; x.beginPath(); x.moveTo(xx,0); x.bezierCurveTo(xx+R(-10,10),h*.3,xx+R(-10,10),h*.6,xx+R(-6,6),h); x.stroke(); } }),
 tweed:ctex(128,128,(x,w,h)=>{ x.fillStyle='#3a4a3a'; x.fillRect(0,0,w,h); for(let i=0;i<w;i+=6){ x.fillStyle='rgba(0,0,0,.18)'; x.fillRect(i,0,2,h); x.fillRect(0,i,w,2); } noise(x,w,h,900,.12); }),
 cloth:ctex(64,64,(x,w,h)=>{ x.fillStyle='#808080'; x.fillRect(0,0,w,h); for(let i=0;i<w;i+=2){ x.fillStyle=`rgba(0,0,0,${.05+rnd()*.08})`; x.fillRect(i,0,1,h); } noise(x,w,h,300,.1); }),
};
// 顔のテクスチャ（球の前面＝u0.25 に描く）
function faceT(draw,bg){ const c=cnv(512,256),x=c.getContext('2d'); x.fillStyle=bg||'#e8d0b8'; x.fillRect(0,0,512,256); x.save(); x.translate(128,128); draw(x); x.restore(); return tex(c); }
const FACE={
 star:faceT(x=>{ x.fillStyle='#f4f2f0'; x.fillRect(-128,-128,256,256);
   const star=(cx,cy,r,col,lw)=>{ x.strokeStyle=col; x.lineWidth=lw; x.beginPath(); for(let i=0;i<=10;i++){ const a=-PI/2+i*PI/5, rr=i%2?r*.45:r; x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); } x.stroke(); };
   star(0,-6,64,'#2a3a8a',6); star(0,-6,48,'#c8202a',5); x.fillStyle='#c8202a'; x.beginPath(); x.moveTo(0,-70); x.lineTo(6,-6); x.lineTo(0,30); x.lineTo(-6,-6); x.fill();
   for(const s of [-1,1]){ x.fillStyle='#1a1a2a'; x.beginPath(); x.ellipse(s*24,-6,9,5,0,0,PI*2); x.fill(); }
   x.fillStyle='#b81828'; x.beginPath(); x.ellipse(0,46,14,6,0,0,PI*2); x.fill(); },'#f4f2f0'),
 mesh:faceT(x=>{ x.fillStyle='#141416'; x.fillRect(-128,-128,256,256); x.strokeStyle='#3a3a40'; x.lineWidth=1.5; for(let r=-10;r<10;r++) for(let c=-10;c<10;c++){ const cx=c*12+(r%2?6:0), cy=r*10; x.beginPath(); for(let i=0;i<=6;i++){ const a=i*PI/3; x.lineTo(cx+Math.cos(a)*6,cy+Math.sin(a)*6); } x.stroke(); } },'#141416'),
 blank:faceT(x=>{ const g=x.createRadialGradient(0,-10,10,0,0,110); g.addColorStop(0,'#e0b896'); g.addColorStop(1,'#b88a68'); x.fillStyle=g; x.fillRect(-128,-128,256,256); x.fillStyle='rgba(90,50,30,.25)'; for(const s of [-1,1]){ x.beginPath(); x.ellipse(s*26,-10,14,6,0,0,PI*2); x.fill(); } x.fillStyle='rgba(90,50,30,.18)'; x.fillRect(-12,38,24,3); },'#c89a78'),
 doll:faceT(x=>{ x.fillStyle='#f0dcc8'; x.fillRect(-128,-128,256,256); const g=x.createRadialGradient(0,20,5,0,20,60); g.addColorStop(0,'rgba(230,120,120,.0)'); x.fillStyle=g;
   for(const s of [-1,1]){ x.fillStyle='rgba(230,120,120,.35)'; x.beginPath(); x.arc(s*34,22,14,0,PI*2); x.fill(); x.fillStyle='#fff'; x.beginPath(); x.ellipse(s*24,-8,11,9,0,0,PI*2); x.fill(); x.fillStyle='#3a6a8a'; x.beginPath(); x.arc(s*24,-7,6.5,0,PI*2); x.fill(); x.fillStyle='#000'; x.beginPath(); x.arc(s*24,-7,3,0,PI*2); x.fill(); x.strokeStyle='#2a1a10'; x.lineWidth=2; x.beginPath(); x.moveTo(s*14,-24); x.lineTo(s*34,-22); x.stroke(); }
   x.strokeStyle='rgba(60,30,20,.5)'; x.lineWidth=1.5; x.beginPath(); x.moveTo(-60,-40); x.lineTo(-30,0); x.lineTo(-40,40); x.stroke(); x.fillStyle='#a04040'; x.beginPath(); x.ellipse(0,40,8,3,0,0,PI*2); x.fill(); },'#f0dcc8'),
 void:faceT(x=>{ x.fillStyle='#050508'; x.fillRect(-128,-128,256,256); for(const s of [-1,1]){ const g=x.createRadialGradient(s*22,-6,0,s*22,-6,12); g.addColorStop(0,'rgba(200,220,255,.9)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(s*22-14,-20,28,28); } },'#050508'),
};
const S=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,flatShading:true},o||{}));
const TM_=(map,c,o)=>new THREE.MeshStandardMaterial(Object.assign({map,color:c||'#fff',roughness:.85,flatShading:true},o||{}));
// ちびキャラの骨組み：頭大きめ（全高約1.75m）
function chibi(o){ const g=new THREE.Group(); const skin=S(o.skin||'#d8a882');
  const hip=new THREE.Group(); hip.position.y=.62; g.add(hip);
  const LG=[]; for(const s of [-1,1]){ const h=new THREE.Group(); h.position.set(s*.1,0,0); hip.add(h); const th=limb(.32,.075,.07,o.legM||o.pantsM); h.add(th); const kn=new THREE.Group(); kn.position.y=-.32; h.add(kn); kn.add(limb(.28,.07,.065,o.shinM||o.legM||o.pantsM));
    const boot=mesh(new THREE.BoxGeometry(.15,.12,.24),o.bootM||S('#2a1a12'),0,-.27,.04); kn.add(boot); if(o.bootTop) kn.add(mesh(new THREE.CylinderGeometry(.085,.08,.18,8),o.bootTop,0,-.16,0)); LG.push({hip:h,knee:kn}); }
  const torso=new THREE.Group(); torso.position.y=.62; g.add(torso);
  torso.add(mesh(lathe([[0,0],[.19,0],[.2,.12],[.21,.3],[.23,.42],[.12,.5],[0,.5]],10),o.shirtM||S('#555'),0,0,0,0,0,0,1,1,.8));
  const head=new THREE.Group(); head.position.y=1.38; g.add(head);
  const hm=new THREE.Mesh(new THREE.SphereGeometry(.3,14,12),o.faceM||skin); hm.scale.set(.9,1.05,.9); head.add(hm); head.add(mesh(new THREE.CylinderGeometry(.07,.08,.12,8),skin,0,-.32,0));
  const AR=[]; for(const s of [-1,1]){ const sh=new THREE.Group(); sh.position.set(s*.24,1.06,0); g.add(sh); sh.add(limb(.24,.07,.065,o.sleeveM||o.shirtM)); const el=new THREE.Group(); el.position.y=-.24; sh.add(el); el.add(limb(.2,.065,.055,o.foreM||o.sleeveM||o.shirtM)); el.add(mesh(new THREE.SphereGeometry(.065,7,6),o.handM||skin,0,-.25,0,0,0,0,1,1.1,.9)); sh.rotation.z=s*.12; AR.push({sh,el}); }
  return {g,head,torso,hip,LG,AR,skin}; }
function stdUpdate(B,t,w,sp){ sp=sp||4; if(w){ walkLegs(B.LG,t*sp,.5); B.AR.forEach((a,i)=>{ a.sh.rotation.x=Math.sin(t*sp+(i?0:PI))*.45; a.el.rotation.x=-.25; }); B.g.position.y=Math.abs(Math.sin(t*sp))*.04; }
  else { B.LG.forEach(l=>{ l.hip.rotation.x=0; l.knee.rotation.x=0; }); B.AR.forEach((a,i)=>{ a.sh.rotation.x=Math.sin(t*1.1+i)*.05; a.el.rotation.x=-.1; }); B.g.position.y=0; }
  B.head.rotation.y=Math.sin(t*.6)*.25; B.head.rotation.z=Math.sin(t*.8)*.04; }
// 丈の長い衣（ローブ・コート）
function longCoat(B,m,len,flare){ const c=mesh(lathe([[.0,1.12],[.24,1.1],[.25,.95],[.27,.6],[.3+flare*.5,.3],[.3+flare,len]].map(([r,y])=>[r,y]),12),m,0,0,0,0,0,0,1,1,.82); c.material.side=THREE.DoubleSide; B.g.add(c); return c; }

// 一、星面（ほしづら）— 星を描いた道化の面とニット帽
DEMONS.push({id:'hoshi',name:'星面',kana:'ほしづら',tag:'道化の悪魔',
 text:'ずり落ちたニット帽に、赤と青の星を描いた白い道化の面。ポケットだらけの胴着には、館で拾った鍵や蝋の欠片を詰めこんでいる。ふざけた足取りで近づいてきて、急に走り出す。',
 stats:[['足の速さ','速い（気まぐれに立ち止まる）'],['鬼としての力','拾った鍵で、閉じた扉を開けて先回りする'],['弱点','光るものを見つけると拾いに行ってしまう'],['気配','ポケットの中身がジャラジャラ鳴る']],
 build(){ const B=chibi({faceM:new THREE.MeshStandardMaterial({map:FACE.star,roughness:.3}),shirtM:S('#8a4a2a'),pantsM:TM_(T.tweed,'#5a4a6a'),bootM:S('#3a2a1e'),bootTop:S('#4a3424')});
  const hat=mesh(new THREE.SphereGeometry(.33,12,8,0,PI*2,0,PI*.55),TM_(T.knit,'#7a746c'),0,.05,-.03,-.2); hat.scale.set(1,1.05,1); B.head.add(hat); B.head.add(mesh(new THREE.TorusGeometry(.29,.05,6,16),TM_(T.knit,'#6a645c'),0,.06,-.02,PI/2-.2));
  for(let i=0;i<6;i++) B.head.add(mesh(new THREE.ConeGeometry(.05,.18,4),S('#2a3a2a'),Math.cos(i)*.3,-.05-i*.03,-.12,0,0,PI/2*(i%2?1:-1)));
  const vest=mesh(lathe([[0,.62],[.23,.62],[.24,.75],[.25,.95],[.25,1.08],[.14,1.12],[0,1.12]],10),TM_(T.tweed,'#4a5a3a')); vest.scale.z=.86; B.g.add(vest);
  for(const s of [-1,1]) for(const y of [.75,.92]) B.g.add(mesh(new THREE.BoxGeometry(.1,.08,.02),S('#3a4a2a'),s*.11,y,.21));
  const keys=mesh(new THREE.TorusGeometry(.04,.008,5,10),S('#b08a3c',{metalness:.9,roughness:.3}),-.2,.72,.12); B.g.add(keys);
  return {g:B.g,update(t,w){ stdUpdate(B,t,w,5); if(!w&&Math.sin(t*.7)>.8) B.head.rotation.z=Math.sin(t*6)*.3; keys.rotation.z=t*3; }}; }});

// 二、網被（あみかぶり）— 網目の面を隠した頭巾の祈祷師
DEMONS.push({id:'ami',name:'網被',kana:'あみかぶり',tag:'網目の悪魔',
